[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlockvm"
version = "0.3.0"
description = "AirlockVM: Dedicated Execution Virtual Machine Control Plane, Runbook Sizing, and MCP Server"
readme = "README.md"
requires-python = ">=3.14"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0.1",
    "mcp>=1.0.0",
]

[project.scripts]
airlock = "airlock.cli:main"
airlock-mcp = "airlock.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]
