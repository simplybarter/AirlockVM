[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "airlockvm"
version = "0.3.0"
description = "AirlockVM: Dedicated Execution Virtual Machine Control Plane, Runbook Sizing, and MCP Server"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "pyyaml>=6.0.4",
    "mcp>=2.3.0",
]

[project.scripts]
airlock = "airlock.cli:main"
airlock-mcp = "airlock.mcp.server:main"

[tool.hatch.build.targets.wheel]
packages = ["src/airlock"]

[tool.hatch.build.targets.wheel.force-include]
".agents/skills" = "airlock/_assets/.agents/skills"
"deploy_app_to_airlock.sh" = "airlock/_assets/deploy_app_to_airlock.sh"
"connect_airlock.sh" = "airlock/_assets/connect_airlock.sh"
