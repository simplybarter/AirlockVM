name: Feature Request
description: Suggest an enhancement or new capability for AirlockVM
title: "[ENHANCEMENT] "
labels: ["enhancement"]
body:
  - type: dropdown
    id: component
    attributes:
      label: Target Area
      options:
        - CLI (`airlock`)
        - MCP Server (`airlock-mcp`)
        - Agent Skills (`.agents/skills/`)
        - IDE Connector (`connect_airlock.sh`)
        - Hypervisor / Networking / Snapshots
        - Documentation / Testing
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem Statement
      description: Is your feature request related to a problem or workflow limitation? Please describe it.
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the behavior, CLI/MCP interface, or architecture you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative approaches or workarounds you have considered.

  - type: textarea
    id: context
    attributes:
      label: Additional Context
      description: Add any other context, sample `vm.yaml` snippets, or links here.
